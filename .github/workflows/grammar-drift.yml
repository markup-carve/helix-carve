name: Grammar drift

# The grammar is a PINNED revision of another repository, so this extension can
# fall behind without a commit here. CI proves the pin still BUILDS and that the
# queries and fixtures still match it - none of which can notice that upstream
# moved, because everything it checks moves with the pin.
#
# The pin sat 32 commits behind while every job stayed green. Those commits
# carried nine grammar fixes, and 103 of the 610 shared-corpus documents parsed
# differently between the two revisions - including five the pinned grammar
# could not parse without an ERROR node at all.
#
# Upstream moving is work, not a failure of this repo (carve#2706), so a pin
# behind main opens or updates one re-vendor pull request and the run stays
# green. It goes red only when the check itself cannot do its job: an invalid
# pin, a missing BUMP_TOKEN, or a push that fails. BUMP_TOKEN is a fine-grained
# PAT rather than the default token, because a pull request the default token
# opens does not trigger this repo's CI.

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      rev:
        description: "Check this grammar revision instead of the languages.toml pin (report only, opens no pull request)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: grammar-drift
  cancel-in-progress: false

# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  grammar-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the grammar
        uses: actions/checkout@v7
        with:
          repository: markup-carve/tree-sitter-carve
          path: tree-sitter-carve
          fetch-depth: 0

      - name: Compare the pinned revision against tree-sitter-carve main
        id: pin
        env:
          REV_OVERRIDE: ${{ inputs.rev }}
        run: PIN_REPORT="$GITHUB_OUTPUT" sh scripts/check-grammar-pin.sh tree-sitter-carve "${REV_OVERRIDE}"

      - name: Open or update the re-vendor pull request
        if: steps.pin.outputs.behind != '0' && inputs.rev == ''
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          REPO: ${{ github.repository }}
          OLD: ${{ steps.pin.outputs.rev }}
          NEW: ${{ steps.pin.outputs.head }}
          BEHIND: ${{ steps.pin.outputs.behind }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::BUMP_TOKEN is not set, so the drift job cannot open the re-vendor pull request"
            exit 1
          fi
          branch=automation/revendor-grammar
          short="${NEW:0:7}"

          # An open pull request already carrying this revision needs nothing;
          # pushing again would only restart its CI.
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${branch}" >/dev/null; then
            git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${branch}"
            if git show FETCH_HEAD:languages.toml | grep -q "${NEW}"; then
              echo "${branch} already pins ${NEW}; nothing to do."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "${branch}"
          sed -i "s/${OLD}/${NEW}/g" languages.toml README.md
          git commit -q -am "chore: move the grammar pin to tree-sitter-carve ${short}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${branch}"

          {
            echo "Moves the \`languages.toml\` grammar pin from \`${OLD:0:7}\` to tree-sitter-carve main \`${short}\`, ${BEHIND} commit(s) ahead."
            echo
            echo "Opened by the scheduled grammar-drift job. CI builds the new revision and checks the queries against it; a red run here means the queries name a node the grammar changed."
            echo
            echo "Upstream commits in this move:"
            echo
            echo '```text'
            git -C tree-sitter-carve log --format='%h %s' "${OLD}..${NEW}"
            echo '```'
          } > "${RUNNER_TEMP}/body.md"

          pr="$(gh pr list --repo "${REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          title="chore: move the grammar pin to tree-sitter-carve ${short}"
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --repo "${REPO}" --title "${title}" --body-file "${RUNNER_TEMP}/body.md"
            echo "Updated #${pr}."
          else
            gh pr create --repo "${REPO}" --base "${BASE}" --head "${branch}" \
              --title "${title}" --body-file "${RUNNER_TEMP}/body.md" \
              --label chore --label area:grammar --label area:editor
          fi
