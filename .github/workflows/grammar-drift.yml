name: Grammar drift

# The grammar is a PINNED revision of another repository, so this extension can
# fall behind without a commit here. CI proves the pin still BUILDS and that the
# queries and fixtures still match it - none of which can notice that upstream
# moved, because everything it checks moves with the pin.
#
# The pin sat 32 commits behind while every job stayed green. Those commits
# carried nine grammar fixes, and 103 of the 610 shared-corpus documents parsed
# differently between the two revisions - including five the pinned grammar
# could not parse without an ERROR node at all.
#
# This job is the one check that looks OUTWARD. A pin behind upstream main
# fails it: a warning on a green run went unread while the pin fell behind.
# The fix for a red run is a re-vendor pull request.

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      rev:
        description: "Check this grammar revision instead of the languages.toml pin"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  grammar-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the grammar
        uses: actions/checkout@v7
        with:
          repository: markup-carve/tree-sitter-carve
          path: tree-sitter-carve
          fetch-depth: 0

      - name: Compare the pinned revision against tree-sitter-carve main
        env:
          REV_OVERRIDE: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          rev="${REV_OVERRIDE:-}"
          [ -n "${rev}" ] || rev="$(grep -oE 'tree-sitter-carve[^0-9a-f]*rev *= *"[0-9a-f]{40}"' languages.toml | grep -oE '[0-9a-f]{40}' | head -1)"
          if [ -z "${rev}" ]; then
            echo "::error::languages.toml: the [[grammar]] source has no 40-hex rev"
            exit 1
          fi
          if ! git -C tree-sitter-carve cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::the grammar pins ${rev}, which is not a commit in markup-carve/tree-sitter-carve"
            exit 1
          fi
          if ! git -C tree-sitter-carve merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::grammar ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C tree-sitter-carve rev-list --count "${rev}..origin/main")"
          echo "grammar pin: ${rev} ($(git -C tree-sitter-carve log -1 --format=%s "${rev}"))"
          echo "tree-sitter-carve main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::error::the grammar pin ${rev} is ${behind} commit(s) behind tree-sitter-carve main $(git -C tree-sitter-carve rev-parse origin/main); re-vendor the grammar"
            exit 1
          fi
