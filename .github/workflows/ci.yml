name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Helix config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate languages.toml parses
        run: |
          python - <<'PY'
          import tomllib
          with open("languages.toml", "rb") as handle:
              tomllib.load(handle)
          print("OK: languages.toml is valid TOML")
          PY

      - name: Check tree-sitter query files are present
        run: |
          for q in highlights indents injections textobjects; do
            test -s "runtime/queries/carve/$q.scm" || { echo "Missing or empty runtime/queries/carve/$q.scm"; exit 1; }
          done
          echo "All Helix query files present."

  grammar:
    name: Grammar parses sample files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install tree-sitter CLI
        # Pinned to the 0.26 minor: validated against this grammar repo layout
        # (tree-sitter.json config, committed src/parser.c).
        run: npm install -g tree-sitter-cli@0.26

      - name: Extract pinned grammar rev from languages.toml
        id: grammar-rev
        run: |
          rev=$(sed -n 's/.*rev = "\([0-9a-f]\{40\}\)".*/\1/p' languages.toml | head -n1)
          if [ -z "$rev" ]; then
            echo "Could not extract grammar rev from languages.toml"
            exit 1
          fi
          echo "Pinned tree-sitter-carve rev: $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Clone tree-sitter-carve at pinned rev
        run: |
          git clone https://github.com/markup-carve/tree-sitter-carve "$RUNNER_TEMP/tree-sitter-carve"
          git -C "$RUNNER_TEMP/tree-sitter-carve" checkout "${{ steps.grammar-rev.outputs.rev }}"

      - name: Build grammar
        # src/parser.c is committed upstream, so no `tree-sitter generate` needed.
        working-directory: ${{ runner.temp }}/tree-sitter-carve
        run: tree-sitter build

      # A query naming a node the grammar does not have captures nothing and
      # highlights nothing, while the file still exists and is non-empty - so
      # the presence check above passes and the editor quietly shows plain text.
      # `tree-sitter query` rejects an unknown node type, which is the only
      # thing that can tell the two apart.
      - name: Queries reference nodes the pinned grammar has
        working-directory: ${{ runner.temp }}/tree-sitter-carve
        run: |
          sample="$RUNNER_TEMP/query-probe.crv"
          printf '# H\n\n- item\n\n> quote\n' > "$sample"
          failed=0
          for q in "$GITHUB_WORKSPACE"/runtime/queries/carve/*.scm; do
            if tree-sitter query "$q" "$sample" >/dev/null; then
              echo "OK   $(basename "$q")"
            else
              echo "FAIL $(basename "$q")"
              failed=1
            fi
          done
          exit "$failed"

      # Compiling a query only proves its node names exist. Several patterns
      # claim the same node and only one color reaches the screen, so a pattern
      # that never wins is indistinguishable from a pattern that is absent, and
      # both stay green above. This resolves what Helix would actually paint at
      # a position - overlapping captures are layered in order, so the last one
      # wins - and asserts it.
      - name: Resolve effective highlight captures
        working-directory: ${{ github.workspace }}
        env:
          TS_CWD: ${{ runner.temp }}/tree-sitter-carve
        run: node scripts/highlight-captures.mjs

      - name: Parse sample .crv files
        working-directory: ${{ runner.temp }}/tree-sitter-carve
        run: |
          files=$(find "$GITHUB_WORKSPACE" -name '*.crv' -not -path '*/.git/*' | sort)
          if [ -z "$files" ]; then
            echo "No .crv sample files found in the repository"
            exit 1
          fi
          echo "Parsing:"
          echo "$files"
          # tree-sitter parse exits nonzero if any file yields ERROR/MISSING nodes.
          tree-sitter parse --quiet $files
          echo "All sample files parsed without errors."
